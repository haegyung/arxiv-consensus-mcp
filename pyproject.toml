
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "arxiv-consensus-mcp"
version = "0.1.2"
description = "MCP server for normalized arXiv metadata search and Consensus API search."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = ["mcp>=1.0.0"]
keywords = ["mcp", "arxiv", "consensus", "research", "metadata"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Information Analysis",
]

[project.scripts]
arxiv-consensus-mcp = "arxiv_consensus_mcp.server:main"
consensus-api-mcp = "arxiv_consensus_mcp.consensus_api_adapter:main"

[project.urls]
Homepage = "https://github.com/haegyung/arxiv-consensus-mcp"
Repository = "https://github.com/haegyung/arxiv-consensus-mcp"
Issues = "https://github.com/haegyung/arxiv-consensus-mcp/issues"
